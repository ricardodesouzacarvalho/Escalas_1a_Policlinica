<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escalas — 1ª Policlínica CBMERJ</title>
<link rel="icon" type="image/webp" href="assets/logo-policlinica.webp">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <!-- Brasão oficial da 1ª Policlínica — Campinho, CBMERJ -->
    <div class="badge" aria-hidden="true">
      <img src="assets/logo-policlinica.webp" width="74" height="74" alt="">
    </div>
    <div class="hero-text">
      <div class="eyebrow">Corpo de Bombeiros Militar do Estado do Rio de Janeiro</div>
      <h1>1ª Policlínica <span class="thin">— Campinho</span></h1>
      <div class="hero-sub" id="hero-pills">
        <span class="pill gold">Escalas de Serviço</span>
        <span class="pill" id="pill-competencia">Carregando…</span>
        <span class="pill">Divulgação pública</span>
      </div>
    </div>
    <button class="btn-print" onclick="window.print()" title="Imprimir a tela atual">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Imprimir tela
    </button>
  </div>

  <div class="chipbar"><div class="chipbar-inner" id="chipbar"></div></div>
</header>

<nav class="pagenav" aria-label="Navegação entre páginas">
  <div class="pagenav-inner">
    <a href="index.html" class="active">🏠 Escalas</a>
    <a href="correcoes.html">📋 Correções do dia</a>
    <a href="auditoria.html">🔍 Auditoria<span class="badge-alert" id="audit-badge" style="display:none"></span></a>
  </div>
</nav>

<div class="srcbar" id="srcbar"></div>

<div class="toolbar">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Buscar por profissional, patente ou data…" autocomplete="off">
  </label>
  <div class="field">
    <label for="sel-tipo">Tipo de Escala</label>
    <select id="sel-tipo"></select>
  </div>
  <div class="seg" id="seg-view" role="tablist" aria-label="Modo de visualização">
    <button id="view-day" class="active" role="tab">Por Data</button>
    <button id="view-prof" role="tab">Por Profissional</button>
  </div>
</div>

<section class="stats" id="stats" aria-label="Resumo"></section>
<div class="legend" id="legend"></div>

<main><div id="content"><div class="empty">Carregando escalas…</div></div></main>

<footer id="footer">
  <strong>1ª Policlínica — CBMERJ</strong> · Documento de divulgação pública ·
  Confira sempre a versão oficial publicada.
</footer>

<script>
/* ============================================================
   Site estático: os dados NÃO estão fixos no código. Eles vêm de
   data/escalas.json (gerado a partir do Google Docs mantido pela
   administração) e data/contatos.json (telefones para WhatsApp).
   Layouts suportados: 'shift' (M/T) · 'team' (equipe) · 'pair' (2 colunas)
   ============================================================ */
const M=1,T=2;

let SCHEDULES=[];
let byId={};
let CONTACTS=[];
let META={};
let FERIAS={atualizadoEm:null,linkQuadro:null,periodos:[]};

/* ---------- HELPERS ---------- */
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const RANKS=[
  [/^TEN\s+CEL\b/i,"TEN CEL","r-tc"],
  [/^SUBTEN\b/i,"SUBTEN","r-sub"],
  [/^[1-3][°º]\s*TEN\b/i,null,"r-ten"],
  [/^[1-3][°º]\s*SGT\b/i,null,"r-sgt"],
  [/^CEL\b/i,"CEL","r-cel"],
  [/^MAJ\b/i,"MAJ","r-maj"],
  [/^CAP\b/i,"CAP","r-cap"],
  [/^SGT\b/i,"SGT","r-sgt"],
  [/^TEN\b/i,"TEN","r-ten"],
];
function rank(nameRaw){
  const n=(nameRaw||"").replace(/\s+/g," ").trim();
  for(const [re,label,cls] of RANKS){
    const m=n.match(re);
    if(m) return {label:(label||m[0].trim()).toUpperCase(),cls,rest:n.slice(m[0].length).trim(),full:n};
  }
  return {label:"",cls:"r-sgt",rest:n,full:n};
}

let CONTACT_BY_KEY={};
function contactFor(restName){
  return CONTACT_BY_KEY[norm(restName)];
}
function waHref(phoneRaw,personName){
  const digits=(phoneRaw||"").replace(/\D/g,"");
  if(!digits)return null;
  const text=encodeURIComponent(`Olá, ${personName} — sobre a escala de serviço da 1ª Policlínica.`);
  return `https://wa.me/${digits}?text=${text}`;
}
const WA_ICON=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.6-.8-1.9-.9-.2-.1-.4-.1-.6.1-.2.2-.6.9-.8 1.1-.1.2-.3.2-.5.1-1.5-.7-2.5-1.3-3.5-2.9-.3-.4 0-.4.3-.8.2-.2.3-.4.1-.6-.1-.2-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.4-.2.3-.9 1-.9 2.3 0 1.4 1 2.7 1.2 2.9.2.2 1.9 3 4.7 4.1 2.3 1 2.3.6 2.7.5.4-.1 1.6-.6 1.8-1.3.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.6-.3zm-5.5 6.5h0c-1.6 0-3.1-.4-4.5-1.2l-.3-.2-3.3.9.9-3.2-.2-.3C3.9 15.4 3.5 13.7 3.5 12c0-4.7 3.8-8.5 8.5-8.5 2.3 0 4.4.9 6 2.5 1.6 1.6 2.5 3.7 2.5 6 0 4.7-3.8 8.5-8.5 8.5zm7.1-15.6C17.4 3.6 14.8 2.5 12 2.5 6.8 2.5 2.5 6.8 2.5 12c0 1.7.4 3.4 1.3 4.8L2.5 21.5l4.8-1.3c1.4.8 3 1.2 4.7 1.2h0c5.2 0 9.5-4.3 9.5-9.5 0-2.5-1-4.9-2.9-6.6z"/></svg>`;
function waButton(phoneRaw,personName){
  const href=waHref(phoneRaw,personName);
  if(!href)return "";
  return `<a class="wa-btn" href="${href}" target="_blank" rel="noopener" title="Chamar ${personName} no WhatsApp" onclick="event.stopPropagation()">${WA_ICON}</a>`;
}
function rankHTML(nameRaw){
  const r=rank(nameRaw);
  const c=contactFor(r.rest);
  const wa=c?waButton(c.whatsapp,r.full):"";
  return `<span class="rank ${r.cls}">${r.label||"—"}</span><span class="name">${r.rest}</span>${wa}`;
}
const dd=d=>d.slice(0,5);

function dayNames(sc,day){
  if(sc.layout==="shift")return day.r.map(x=>x[0]);
  if(sc.layout==="team")return day.t;
  return [...day.a.map(x=>x.n),...day.b.map(x=>x.n)];
}
function dayBlob(sc,day){return norm(day.d+" "+day.wd+" "+dayNames(sc,day).join(" "));}

function brDateToJs(s){const [d,m,y]=s.split("/").map(Number);return new Date(y,m-1,d);}
function periodoAtivo(p,hoje){const h=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());return brDateToJs(p.inicio)<=h&&h<=brDateToJs(p.fim);}

/* ---------- STATE ---------- */
const state={sched:"geral",view:"day",q:""};

/* ---------- CHIPS + SELECT ---------- */
function distinctCalendarDays(){
  const set=new Set();SCHEDULES.forEach(s=>s.days.forEach(d=>set.add(d.d)));return set.size;
}
function buildChrome(){
  const chips=[["geral","GERAL",distinctCalendarDays()],
    ...SCHEDULES.map(s=>[s.id,s.label.toUpperCase(),s.days.length]),
    ["ferias","FÉRIAS",FERIAS.periodos.length]];
  document.getElementById("chipbar").innerHTML=chips.map(([id,lbl,c])=>
    `<button class="tchip" data-sched="${id}"><span>${lbl}</span><span class="cnt">${c}</span></button>`).join("");
  document.getElementById("sel-tipo").innerHTML=chips.map(([id,lbl,c])=>
    `<option value="${id}">${id==="geral"?"Geral — todas":id==="ferias"?"Férias":(byId[id].short||byId[id].label)} (${c})</option>`).join("");
  document.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>setSched(b.dataset.sched));
  document.getElementById("sel-tipo").onchange=e=>setSched(e.target.value);
}

function syncChrome(){
  document.querySelectorAll(".tchip").forEach(b=>b.classList.toggle("active",b.dataset.sched===state.sched));
  document.getElementById("sel-tipo").value=state.sched;
  document.getElementById("seg-view").classList.toggle("hidden",state.sched==="geral"||state.sched==="ferias");
}

/* ---------- STATS + LEGEND ---------- */
function renderStatsLegend(){
  const stats=document.getElementById("stats"), legend=document.getElementById("legend");
  const competencia=META.competencia||"—";
  if(state.sched==="geral"){
    let entries=0;
    SCHEDULES.forEach(s=>s.days.forEach(d=>entries+=dayNames(s,d).length));
    stats.innerHTML=statCards([[SCHEDULES.length,"Escalas"],[distinctCalendarDays(),"Dias no mês"],[entries,"Designações"],[competencia,"Competência"]]);
    legend.innerHTML=`<span class="item hint">Selecione um tipo de escala nos chips acima ou clique em um cartão. Use a busca para localizar um profissional em todas as escalas.</span>`;
    return;
  }
  if(state.sched==="ferias"){
    const hoje=new Date();
    const ativos=FERIAS.periodos.filter(p=>periodoAtivo(p,hoje)).length;
    stats.innerHTML=statCards([[FERIAS.periodos.length,"Períodos"],[ativos,"De férias hoje"],[competencia,"Competência"]]);
    legend.innerHTML=`<span class="item"><span class="dot a"></span> Em férias agora</span><span class="item"><span class="dot b"></span> Período futuro/encerrado</span>`;
    return;
  }
  const sc=byId[state.sched];
  const profs=new Set();let entries=0;
  sc.days.forEach(d=>dayNames(sc,d).forEach(n=>{profs.add(norm(rank(n).rest));entries++;}));
  stats.innerHTML=statCards([[sc.days.length,"Dias de escala"],[profs.size,"Profissionais"],[entries,sc.unit],[competencia,"Competência"]]);

  if(sc.layout==="shift")
    legend.innerHTML=`<span class="item"><span class="chip m">M</span> Manhã</span><span class="item"><span class="chip t">T</span> Tarde</span><span class="item hint" style="color:var(--silver-500)">Botão “Imprimir tela” ou Ctrl/Cmd + P</span>`;
  else if(sc.layout==="pair")
    legend.innerHTML=`<span class="item"><span class="dot a"></span> ${sc.cols[0]}</span><span class="item"><span class="dot b"></span> ${sc.cols[1]}</span><span class="item hint" style="color:var(--silver-500)">Botão “Imprimir tela” ou Ctrl/Cmd + P</span>`;
  else
    legend.innerHTML=`<span class="item"><span class="dot a"></span> Equipe do dia</span><span class="item hint" style="color:var(--silver-500)">Botão “Imprimir tela” ou Ctrl/Cmd + P</span>`;
}
const statCards=arr=>arr.map(([n,l])=>`<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join("");

/* ---------- RENDER: content ---------- */
function render(){
  syncChrome();renderStatsLegend();
  const el=document.getElementById("content");
  const q=norm(state.q.trim());
  if(state.sched==="geral"){el.innerHTML=renderDash(q);bindDash();return;}
  if(state.sched==="ferias"){el.innerHTML=renderFerias(q);return;}
  const sc=byId[state.sched];
  el.innerHTML=state.view==="day"?renderDays(sc,q):renderProf(sc,q);
}

/* FÉRIAS (períodos, não dias) */
function renderFerias(q){
  if(!FERIAS.periodos.length){
    return `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <div>Nenhum período de férias sincronizado ainda.</div>
      ${FERIAS.linkQuadro?`<div style="margin-top:8px"><a href="${FERIAS.linkQuadro}" target="_blank" rel="noopener">Ver quadro no Trello ↗</a></div>`:""}
    </div>`;
  }
  const hoje=new Date();
  const items=FERIAS.periodos
    .filter(p=>!q||norm(p.nome).includes(q))
    .slice()
    .sort((a,b)=>brDateToJs(a.inicio)-brDateToJs(b.inicio));
  const cards=items.map(p=>{
    const ativo=periodoAtivo(p,hoje);
    const r=rank(p.nome);
    const c=contactFor(r.rest);
    const wa=c?waButton(c.whatsapp,r.full):"";
    return `<div class="prof"><div class="prof-head">
      <span class="dot ${ativo?'a':'b'}"></span>
      <span class="rank ${r.cls}">${r.label||"—"}</span><span class="name">${r.rest}</span>${wa}
      <span class="badge-count">${ativo?"de férias agora":dd(p.inicio)+" – "+dd(p.fim)}</span>
      </div>
      <div class="prof-days"><span class="dtag"><span class="dd">${p.inicio}</span> até <span class="dd">${p.fim}</span></span></div>
    </div>`;
  }).join("");
  return `<div class="grid">${cards||emptyBlock()}</div>`;
}

/* GERAL dashboard */
function renderDash(q){
  const cards=SCHEDULES.map(sc=>{
    let hits=0;
    if(q)sc.days.forEach(d=>{if(dayBlob(sc,d).includes(q))hits++;});
    if(q&&hits===0)return "";
    const profs=new Set();sc.days.forEach(d=>dayNames(sc,d).forEach(n=>profs.add(norm(rank(n).rest))));
    return `<button class="dcard" data-sched="${sc.id}">
      <h3>${sc.label}</h3><div class="sub">${sc.short||nameForLayout(sc)}</div>
      <div class="metrics">
        <div class="metric"><div class="n">${sc.days.length}</div><div class="l">Dias</div></div>
        <div class="metric"><div class="n">${profs.size}</div><div class="l">Profissionais</div></div>
      </div>
      ${q?`<div class="hitline">${hits} dia(s) com “${state.q.trim()}”</div>`:""}
      <div class="go">Abrir escala ▸</div>
    </button>`;
  }).join("");
  return `<div class="dash">${cards||emptyBlock()}</div>`;
}
function nameForLayout(sc){return sc.layout==="pair"?sc.cols.join(" · "):sc.layout==="shift"?"Manhã / Tarde":"Equipe diária";}
function bindDash(){document.querySelectorAll(".dcard").forEach(b=>b.onclick=()=>setSched(b.dataset.sched));}

/* DAY view per layout */
function renderDays(sc,q){
  const cards=sc.days.map(day=>{
    const match=!q||dayBlob(sc,day).includes(q);
    if(!match)return "";
    if(day.feriado){
      return `<article class="card">
        <div class="card-head"><div><div class="date">${dd(day.d)}</div><div class="wd">${day.wd}</div></div></div>
        <div class="feriado-box">★ ${day.feriado}</div></article>`;
    }
    let body,count;
    if(sc.layout==="shift"){
      count=day.r.length;
      body=`<ul class="roster">`+day.r.map(([n,s])=>`<li class="${q&&norm(rank(n).rest).includes(q)?'hit':''}">${rankHTML(n)}
        <span class="shifts"><span class="sh ${s&M?'on-m':'off'}">M</span><span class="sh ${s&T?'on-t':'off'}">T</span></span></li>`).join("")+`</ul>`;
    }else if(sc.layout==="team"){
      count=day.t.length;
      body=`<ul class="roster">`+day.t.map(n=>`<li class="${q&&norm(rank(n).rest).includes(q)?'hit':''}">${rankHTML(n)}</li>`).join("")+`</ul>`;
    }else{
      count=day.a.length+day.b.length;
      body=pairSec(sc.cols[0],"a",day.a,q)+pairSec(sc.cols[1],"b",day.b,q);
    }
    return `<article class="card">
      <div class="card-head"><div><div class="date">${dd(day.d)}</div><div class="wd">${day.wd}</div></div><span class="count">${count}</span></div>
      ${body}</article>`;
  }).join("");
  return `<div class="grid">${cards||emptyBlock()}</div>`;
}
function pairSec(label,cls,arr,q){
  return `<div class="pair-sec"><div class="pair-lbl ${cls}"><span class="dot ${cls}"></span>${label}</div>`+
    arr.map(e=>`<div class="pair-row ${q&&norm(rank(e.n).rest).includes(q)?'hit':''}">${e.t?`<span class="time-tag">${e.t}</span>`:""}${rankHTML(e.n)}</div>`).join("")+`</div>`;
}

/* PROFESSIONAL view per layout */
function renderProf(sc,q){
  const map=new Map();
  const push=(n,dstr,meta)=>{const k=rank(n).rest;if(!map.has(k))map.set(k,{full:n,items:[]});map.get(k).items.push({dd:dd(dstr),meta});};
  sc.days.forEach(day=>{
    if(day.feriado)return;
    if(sc.layout==="shift")day.r.forEach(([n,s])=>push(n,day.d,{type:"shift",s}));
    else if(sc.layout==="team")day.t.forEach(n=>push(n,day.d,null));
    else{day.a.forEach(e=>push(e.n,day.d,{type:"role",cls:"a"}));day.b.forEach(e=>push(e.n,day.d,{type:"role",cls:"b"}));}
  });
  const names=[...map.keys()].sort((a,b)=>a.localeCompare(b,"pt")).filter(k=>!q||norm(k).includes(q));
  const cards=names.map(k=>{
    const {full,items}=map.get(k);
    const c=contactFor(k);
    const wa=c?waButton(c.whatsapp,full):"";
    const tags=items.map(it=>{
      let badge="";
      if(it.meta&&it.meta.type==="shift")badge=(it.meta.s&M?'<span class="mini m">M</span>':'')+(it.meta.s&T?'<span class="mini t">T</span>':'');
      else if(it.meta&&it.meta.type==="role")badge=`<span class="mini ${it.meta.cls}">${it.meta.cls==="a"?sc.cols[0].slice(0,4):sc.cols[1].slice(0,4)}</span>`;
      return `<span class="dtag"><span class="dd">${it.dd}</span>${badge}</span>`;
    }).join("");
    return `<div class="prof"><div class="prof-head"><span class="rank ${rank(full).cls}">${rank(full).label||"—"}</span>
      <span class="name">${k}</span>${wa}<span class="badge-count">${items.length} dia${items.length>1?'s':''}</span></div>
      <div class="prof-days">${tags}</div></div>`;
  }).join("");
  return `<div class="grid">${cards||emptyBlock()}</div>`;
}

function emptyBlock(){return `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><div>Nenhum resultado encontrado.</div></div>`;}
function errorBlock(msg){return `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div>${msg}</div></div>`;}

/* ---------- ACTIONS ---------- */
function setSched(id){state.sched=id;render();window.scrollTo({top:0,behavior:"smooth"});}
function setView(v){state.view=v;document.getElementById("view-day").classList.toggle("active",v==="day");document.getElementById("view-prof").classList.toggle("active",v==="prof");render();}

/* ---------- FONTE / RODAPÉ ---------- */
const ACTIONS_URL="https://github.com/ricardodesouzacarvalho/Escalas_1a_Policlinica/actions/workflows/sync-escala.yml";

function renderSrcBar(){
  const el=document.getElementById("srcbar");
  const partes=[`<button id="btn-refresh" title="Recarrega os dados já publicados (não refaz a sincronização)">🔄 Atualizar dados</button>`];
  if(META.atualizadoEm){
    const dt=new Date(META.atualizadoEm);
    partes.push(`<span id="last-sync">Última sincronização: <b>${dt.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</b></span>`);
  }
  if(META.linkEdicao){
    partes.push(`<a href="${META.linkEdicao}" target="_blank" rel="noopener">Editar escala no Google Docs ↗</a>`);
  }
  partes.push(`<a href="${ACTIONS_URL}" target="_blank" rel="noopener">Forçar sincronização (GitHub Actions) ↗</a>`);
  el.innerHTML=partes.join(" · ");
  document.getElementById("btn-refresh").addEventListener("click",refreshAll);
  if(META.competencia){
    document.getElementById("pill-competencia").textContent=META.competencia;
    document.title=`Escalas — 1ª Policlínica CBMERJ — ${META.competencia}`;
  }
}

async function refreshAll(){
  const btn=document.getElementById("btn-refresh");
  if(btn){btn.disabled=true;btn.textContent="🔄 Atualizando…";}
  await init();
  if(btn){btn.disabled=false;}
}

/* ---------- INIT ---------- */
async function init(){
  try{
    const [escalasRes,contatosRes,feriasRes,auditoriaRes]=await Promise.all([
      fetch("data/escalas.json",{cache:"no-store"}),
      fetch("data/contatos.json",{cache:"no-store"}).catch(()=>null),
      fetch("data/ferias.json",{cache:"no-store"}).catch(()=>null),
      fetch("data/auditoria.json",{cache:"no-store"}).catch(()=>null),
    ]);
    if(!escalasRes.ok)throw new Error("HTTP "+escalasRes.status);
    const data=await escalasRes.json();
    META={competencia:data.competencia,atualizadoEm:data.atualizadoEm,linkEdicao:data.linkEdicao,docId:data.docId};
    SCHEDULES=data.escalas;
    byId=Object.fromEntries(SCHEDULES.map(s=>[s.id,s]));

    if(contatosRes&&contatosRes.ok){
      CONTACTS=await contatosRes.json();
      CONTACT_BY_KEY=Object.fromEntries(CONTACTS.filter(c=>c.whatsapp).map(c=>[norm(c.nome),c]));
    }
    if(feriasRes&&feriasRes.ok){
      FERIAS=await feriasRes.json();
    }
    if(auditoriaRes&&auditoriaRes.ok){
      const aud=await auditoriaRes.json();
      const badge=document.getElementById("audit-badge");
      if(badge&&aud.resumo&&aud.resumo.alta>0){badge.textContent=aud.resumo.alta;badge.style.display="";}
    }

    renderSrcBar();
    buildChrome();
    render();
  }catch(err){
    document.getElementById("content").innerHTML=errorBlock("Não foi possível carregar as escalas agora. Tente novamente em alguns minutos.");
    console.error(err);
  }
}
